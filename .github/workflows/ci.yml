# Continuous integration for the Calculator project.
#
# Runs on every push and pull request against the main branch. The work
# is split into independent jobs so the GitHub Actions UI renders each
# step as its own block in the run graph:
#
#   ktlint   ─┐
#   detekt   ─┤
#   lint     ─┤
#   tests    ─┼──> ci-success
#   assemble ─┤
#   release  ─┘
#
# Each gate runs in parallel on its own runner. `ci-success` is a tiny
# aggregator that branch protection can require as a single check.
#
# Compose UI tests run on the JVM through Robolectric inside `tests`.
# There are no instrumented (emulator) tests yet; add an emulator job
# together with the first test that really needs a device.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run ktlint
        run: ./gradlew ktlintCheck --stacktrace
      # CLAUDE.md: a feature package uses only core/ (and its own code).
      # The app shell in navigation/ is the only place that knows features.
      - name: Check feature package boundaries
        run: |
          fail=0
          for dir in app/src/main/java/com/calculator/feature/*/; do
            name=$(basename "$dir")
            if grep -rnE "com\.calculator\.(navigation|MainActivity|feature\.)" "$dir" \
              | grep -vE "com\.calculator\.feature\.$name([^A-Za-z0-9_]|$)"; then
              echo "::error::feature/$name uses another feature or the app shell."
              fail=1
            fi
          done
          exit $fail
      # User text lives in strings.xml so it can be translated.
      - name: Check for hard-coded user text
        run: |
          if grep -rnE '(text|label|contentDescription|title|description|message)\s*=\s*"[A-Za-z][a-z]|Text\("[A-Za-z][a-z]' \
            app/src/main/java/com/calculator/feature app/src/main/java/com/calculator/core/domain \
            app/src/main/java/com/calculator/core/designsystem app/src/main/java/com/calculator/navigation; then
            echo "::error::Move the text above to strings.xml (English and Hindi)."
            exit 1
          fi
      - name: Upload ktlint report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ktlint-report
          path: app/build/reports/ktlint/
          retention-days: 7

  detekt:
    name: detekt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run detekt
        run: ./gradlew detekt --stacktrace
      - name: Upload detekt report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 7

  lint:
    name: Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run Android Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Upload lint report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run unit tests
        run: ./gradlew test --stacktrace
      - name: Upload test report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          retention-days: 7

  assemble-debug:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: calculator-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  release-build:
    # The R8-shrunk release build otherwise runs only after a tag is
    # pushed. Catches broken keep rules and the 15 MB size target early.
    name: Release build and size
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Lint and bundle the release build
        run: ./gradlew :app:lintRelease :app:bundleRelease --stacktrace
      # PRIVACY.md and the Play listing name every permission; a new one
      # (often added by a library) must be reviewed and documented first.
      - name: Check the release permissions
        run: |
          grep -o 'uses-permission[^>]*android:name="[^"]*"' \
            app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml \
            | sed 's/.*android:name="//; s/"$//' | sort > /tmp/permissions.txt
          if ! diff -u config/release-permissions.txt /tmp/permissions.txt; then
            echo "::error::Release permissions changed. Update config/release-permissions.txt, PRIVACY.md and docs/PLAY_LISTING.md."
            exit 1
          fi
      - name: Check the AAB size
        run: |
          size=$(stat -c%s app/build/outputs/bundle/release/app-release.aab)
          max=$((15 * 1024 * 1024))
          echo "AAB size: $size bytes (limit $max)"
          if [ "$size" -gt "$max" ]; then
            echo "::error::The release AAB is $size bytes, over the 15 MB limit."
            exit 1
          fi

  ci-success:
    # Single required check for branch protection. Fails if any upstream
    # gate failed, was cancelled or was skipped.
    name: CI success
    runs-on: ubuntu-latest
    needs: [ktlint, detekt, lint, unit-tests, assemble-debug, release-build]
    if: ${{ always() }}
    steps:
      - name: Verify all upstream jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "One or more CI jobs failed, were cancelled or were skipped."
            exit 1
          fi
          echo "All CI jobs passed."
