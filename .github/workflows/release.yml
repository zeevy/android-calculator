# Release workflow.
#
# Triggered manually or by pushing a tag like `v0.1.0`. Split into two
# connected jobs so the Actions UI renders the pipeline as a DAG:
#
#   build-artifacts  ──>  publish-release
#
# 1. `build-artifacts` assembles the release APK + AAB and uploads them.
# 2. `publish-release` downloads the APK + AAB and attaches them to a
#    GitHub release. Only runs for tag pushes.
#
# Signing is intentionally left unsigned for now; once Play App Signing
# is enrolled the release config will pull the keystore from encrypted
# secrets and produce a signed AAB.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish (e.g. v0.1.0)
        required: true

# Read-only by default. Only the publish job, which runs no project code,
# gets a write token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Play rejects a reused versionCode, and a tag that does not match
      # the app version publishes a confusing release. Fail before building.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "v$name" ]; then
            echo "::error::Tag $TAG does not match versionName $name."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          expected=$((major * 10000 + minor * 100 + patch))
          if [ "$code" != "$expected" ]; then
            echo "::error::versionCode is $code; docs/RELEASE.md says $name needs $expected."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Bundle release AAB
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build-artifacts.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: calculator-apk
          path: artifacts/apk

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: calculator-aab
          path: artifacts/aab

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Drafted, not published: the runbook's last step is to replace the
          # auto-generated commit list with the user-visible bullets from
          # CHANGELOG.md, which has to happen before anyone sees the release.
          draft: true
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab
