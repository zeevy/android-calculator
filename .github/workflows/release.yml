# Release workflow.
#
# Triggered manually or by pushing a tag like `v0.1.0`. Split into connected
# jobs so the Actions UI renders the pipeline as a DAG:
#
#   build-artifacts  ──>  publish-release
#                    ──>  publish-play
#
# 1. `build-artifacts` assembles the release APK + AAB, signed with the
#    upload key from secrets, and uploads them.
# 2. `publish-release` attaches the APK + AAB to a draft GitHub release.
#    Only runs for tag pushes.
# 3. `publish-play` uploads the AAB to Google Play. Only runs for tag
#    pushes, and only when the PLAY_TRACK repository variable is set.
#
# The publish jobs run no project code, so the GitHub write token and the
# Play key never reach the Gradle build. The setup is in docs/RELEASE.md.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Tag name to publish (e.g. v0.1.0)
        required: true

# Read-only by default. Only the publish job, which runs no project code,
# gets a write token.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-artifacts:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # Play rejects a reused versionCode, and a tag that does not match
      # the app version publishes a confusing release. Fail before building.
      - name: Check the tag matches the app version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          name=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          code=$(sed -nE 's/^ *versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [ "$TAG" != "v$name" ]; then
            echo "::error::Tag $TAG does not match versionName $name."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$name"
          expected=$((major * 10000 + minor * 100 + patch))
          if [ "$code" != "$expected" ]; then
            echo "::error::versionCode is $code; docs/RELEASE.md says $name needs $expected."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::The tagged commit is not on main."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Without the secrets (a fork, or before the key exists) the build
      # stays unsigned, which Play rejects.
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 secret: the build is unsigned."
          fi

      - name: Assemble release APK and AAB
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90

      # Play uses it to show readable stack traces for the R8-shrunk build.
      - name: Upload R8 mapping artifact
        uses: actions/upload-artifact@v7
        with:
          name: calculator-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-artifacts
    if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build-artifacts.result == 'success' }}
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: calculator-apk
          path: artifacts/apk

      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: calculator-aab
          path: artifacts/aab

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Drafted, not published: the runbook's last step is to replace the
          # auto-generated commit list with the user-visible bullets from
          # CHANGELOG.md, which has to happen before anyone sees the release.
          draft: true
          generate_release_notes: true
          files: |
            artifacts/apk/*.apk
            artifacts/aab/*.aab

  publish-play:
    name: Upload to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-artifacts
    # Off until the PLAY_TRACK variable is set (internal, alpha, beta or
    # production): Google takes the first upload of a new app only through
    # the Play Console.
    if: ${{ startsWith(github.ref, 'refs/tags/') && vars.PLAY_TRACK != '' && needs.build-artifacts.result == 'success' }}

    steps:
      - name: Download AAB
        uses: actions/download-artifact@v8
        with:
          name: calculator-aab
          path: artifacts/aab

      - name: Download R8 mapping
        uses: actions/download-artifact@v8
        with:
          name: calculator-mapping
          path: artifacts/mapping

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.zeevy.calculator
          releaseFiles: artifacts/aab/*.aab
          mappingFile: artifacts/mapping/mapping.txt
          track: ${{ vars.PLAY_TRACK }}
